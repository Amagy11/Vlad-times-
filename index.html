<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шкала отношений · Дневник</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #1e1e2f 0%, #2a2a40 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }
        .app-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(22, 22, 35, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }
        h1 {
            text-align: center;
            font-weight: 500;
            letter-spacing: 1px;
            color: #e6e6fa;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .sync-status {
            text-align: center;
            font-size: 0.85rem;
            color: #8f8fb0;
            margin-top: -1rem;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }
        .section {
            background: rgba(12, 12, 20, 0.6);
            border-radius: 2.2rem;
            padding: 2rem 1.8rem;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 8px 18px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: #d0d0e0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.6rem;
        }
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem 1.5rem;
            min-height: 100px;
        }
        .person-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 190px;
            background: rgba(0,0,0,0.2);
            border-radius: 1.5rem;
            padding: 1rem 0.8rem;
            transition: all 0.3s;
            position: relative;
        }
        .person-card:hover {
            background: rgba(0,0,0,0.35);
            transform: translateY(-3px);
        }
        .delete-person-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(220, 20, 60, 0.3);
            border: 1px solid #dc143c;
            color: #ffbaba;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .delete-person-btn:hover {
            background: rgba(220, 20, 60, 0.6);
            transform: scale(1.1);
        }
        .name-label {
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            color: #f0f0f5;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px black;
            word-break: break-word;
            text-align: center;
            margin-top: 10px;
        }
        .flask-container {
            position: relative;
            width: 70px;
            height: 240px;
            background: #1c1c2a;
            border-radius: 35px 35px 20px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.7), inset 0 0 0 2px #3b3b4e, inset 0 0 10px #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        .flask-top {
            width: 30px;
            height: 14px;
            background: #4a4a60;
            border-radius: 4px 4px 0 0;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.6);
            position: relative;
            top: -2px;
            border: 1px solid #5f5f7a;
            z-index: 2;
            flex-shrink: 0;
        }
        .fill-area {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .green-fill {
            background: linear-gradient(180deg, #7CFC00, #2e8b57);
            box-shadow: inset 0 0 12px #aaff80, 0 0 8px #32cd32;
            transition: height 0.4s ease;
            width: 100%;
            border-radius: 0 0 12px 12px;
            flex-shrink: 0;
        }
        .red-fill {
            background: linear-gradient(0deg, #b22222, #ff4500);
            box-shadow: inset 0 0 12px #ff6347, 0 0 8px #dc143c;
            transition: height 0.4s ease;
            width: 100%;
            border-radius: 12px 12px 0 0;
            flex-shrink: 0;
        }
        .neutral-marker {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 2px;
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 4px rgba(255,255,255,0.4);
            pointer-events: none;
            z-index: 1;
        }
        .status-badge {
            font-weight: 700;
            font-size: 0.9rem;
            background: #0b0b14;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            color: #f5f5fa;
            box-shadow: 0 4px 8px black;
            border: 1px solid #4a4a68;
            margin-top: 0.5rem;
            text-align: center;
            word-break: break-word;
            max-width: 170px;
        }
        .score-value {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 0.3rem;
        }
        .traits-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            justify-content: center;
            margin-top: 0.5rem;
            min-height: 24px;
        }
        .trait-chip {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            background: #2a2a3e;
            border: 1px solid #4a4a68;
            color: #ddd;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .trait-chip.positive-trait {
            border-color: #32cd32;
            color: #9eff9e;
            background: #1a2a1a;
        }
        .trait-chip.negative-trait {
            border-color: #dc143c;
            color: #ff9e9e;
            background: #2a1a1a;
        }
        .empty-stats-message {
            color: #8888aa;
            font-style: italic;
            text-align: center;
            padding: 2rem;
            width: 100%;
            font-size: 1.2rem;
        }
        .diary-form {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem 1rem;
            align-items: flex-end;
            background: rgba(0,0,0,0.25);
            padding: 1.5rem;
            border-radius: 2rem;
            margin-bottom: 2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .form-group label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b9b9cc;
        }
        input, select, textarea {
            background: #1e1e2c;
            border: 1px solid #3d3d58;
            border-radius: 20px;
            padding: 0.7rem 1.2rem;
            color: #f0f0f8;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        input:focus, select:focus, textarea:focus {
            border-color: #7f7fd5;
            box-shadow: 0 0 10px #4b4b8f;
        }
        .btn {
            background: #2d2d4a;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            border: 1px solid #5b5b83;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn:hover {
            background: #3f3f68;
            transform: translateY(-3px);
            box-shadow: 0 10px 18px black;
        }
        .btn-secondary {
            background: #31314d;
        }
        .diary-entries {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }
        .entry {
            background: #20202e;
            border-radius: 1.2rem;
            padding: 0.9rem 1.2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem 1.2rem;
            border-left: 6px solid #777;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .entry.positive {
            border-left-color: #32cd32;
        }
        .entry.negative {
            border-left-color: #dc143c;
        }
        .entry-person {
            font-weight: 700;
            color: #eaeaf5;
            min-width: 80px;
        }
        .entry-desc {
            flex: 1;
            color: #cbcbe0;
            font-style: italic;
        }
        .entry-trait {
            font-size: 0.7rem;
            background: #2a2a3e;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            border: 1px solid #4a4a68;
            color: #ccc;
        }
        .entry-impact {
            font-weight: 700;
            background: #00000030;
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
        }
        .positive .entry-impact {
            color: #9eff9e;
        }
        .negative .entry-impact {
            color: #ff9e9e;
        }
        .empty-message {
            color: #8888aa;
            font-style: italic;
            text-align: center;
            padding: 2rem;
        }
        .remove-btn {
            background: none;
            border: 1px solid #6b4b4b;
            color: #ffbaba;
            border-radius: 30px;
            padding: 0.25rem 0.8rem;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .remove-btn:hover {
            background: rgba(220, 20, 60, 0.2);
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            .app-container {
                padding: 1.5rem 1rem;
            }
            .diary-form {
                flex-direction: column;
                align-items: stretch;
            }
            .form-group {
                width: 100%;
            }
            .btn {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <h1>⚖️ ШКАЛА ОТНОШЕНИЙ</h1>
    <div class="sync-status" id="syncStatus">⏳ Подключение к Firebase...</div>

    <div class="section">
        <div class="section-title">
            <span>🧪 Колбы баланса + Характер</span>
        </div>
        <div id="statsContainer" class="stats-grid"></div>
    </div>

    <div class="section">
        <div class="section-title">
            <span>📓 Дневник событий</span>
        </div>

        <div class="diary-form">
            <div class="form-group" style="flex:1; min-width:140px;">
                <label>👤 Имя</label>
                <select id="personSelect"></select>
            </div>
            <div class="form-group" style="flex:1.5; min-width:180px;">
                <label>📝 Описание (что случилось)</label>
                <input type="text" id="entryDescription" placeholder="Например: разболтал секрет">
            </div>
            <div class="form-group" style="min-width:140px;">
                <label>🏷️ Характеристика</label>
                <select id="entryTrait">
                    <option value="">— без ярлыка —</option>
                    <option value="хранит секреты">🤐 Хранит секреты</option>
                    <option value="трепло">🗣️ Трепло</option>
                    <option value="помогает">🤲 Помогает</option>
                    <option value="подводит">👎 Подводит</option>
                    <option value="честный">✅ Честный</option>
                    <option value="лгун">❌ Лгун</option>
                    <option value="щедрый">💰 Щедрый</option>
                    <option value="жадный">💸 Жадный</option>
                    <option value="надёжный">🛡️ Надёжный</option>
                    <option value="ненадёжный">⚠️ Ненадёжный</option>
                    <option value="добрый">💖 Добрый</option>
                    <option value="злой">😠 Злой</option>
                    <option value="весёлый">😄 Весёлый</option>
                    <option value="токсичный">☠️ Токсичный</option>
                    <option value="умный">🧠 Умный</option>
                    <option value="глупый">🤦 Глупый</option>
                    <option value="уважает">🙏 Уважает</option>
                    <option value="неуважает">🚫 Неуважает</option>
                    <option value="верный">🤞 Верный</option>
                    <option value="предатель">🔪 Предатель</option>
                </select>
            </div>
            <div class="form-group">
                <label>➡️ Тип</label>
                <select id="entryType">
                    <option value="positive">➕ Хорошее</option>
                    <option value="negative">➖ Плохое</option>
                </select>
            </div>
            <div class="form-group">
                <label>🔢 Сила (1-10)</label>
                <input type="number" id="entryImpact" min="1" max="10" value="5">
            </div>
            <button class="btn" id="addEntryBtn">➕ Добавить</button>
            <button class="btn btn-secondary" id="addPersonBtn">👤 + Имя</button>
        </div>

        <div id="diaryEntries" class="diary-entries"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
        getFirestore, 
        doc, 
        getDoc, 
        setDoc, 
        updateDoc, 
        onSnapshot,
        serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase конфигурация
    const firebaseConfig = {
        apiKey: "AIzaSyDe_BVxqwGkqcJKgAzyQJ69SgbRRMmWsLs",
        authDomain: "vlad-time.firebaseapp.com",
        projectId: "vlad-time",
        storageBucket: "vlad-time.firebasestorage.app",
        messagingSenderId: "783565854938",
        appId: "1:783565854938:web:522a080a51e6090aa22de3",
        measurementId: "G-6MWET3D1L9"
    };

    // Инициализация Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM элементы
    const syncStatus = document.getElementById('syncStatus');
    const statsContainer = document.getElementById('statsContainer');
    const personSelect = document.getElementById('personSelect');
    const entryDescription = document.getElementById('entryDescription');
    const entryType = document.getElementById('entryType');
    const entryImpact = document.getElementById('entryImpact');
    const entryTrait = document.getElementById('entryTrait');
    const addEntryBtn = document.getElementById('addEntryBtn');
    const addPersonBtn = document.getElementById('addPersonBtn');
    const diaryEntriesDiv = document.getElementById('diaryEntries');

    // Данные
    let people = [];
    let diary = [];
    let isLocalChange = false; // Флаг для предотвращения циклов
    let saveTimeout = null; // Для debounce сохранений

    // Ссылка на документ в Firestore
    const docRef = doc(db, "relationshipData", "main");

    // Вспомогательные функции
    function clampScore(score) {
        return Math.max(-100, Math.min(100, score));
    }

    function getRelationshipStatus(score) {
        if (score >= 80) return '💎 Лучший друг / родная душа';
        if (score >= 60) return '🤝 Близкий друг';
        if (score >= 40) return '🙂 Хороший знакомый';
        if (score >= 20) return '👋 Приятель';
        if (score > 0) return '😐 Нейтрально-положительно';
        if (score === 0) return '⚪ Нейтрально';
        if (score > -20) return '🤨 Лёгкая неприязнь';
        if (score >= -40) return '😒 Неприятный человек';
        if (score >= -60) return '😠 Враг / конфликт';
        if (score >= -80) return '💢 Опасный враг';
        return '🚫 Полный разрыв / без контактов';
    }

    function getTraitsForPerson(personName) {
        const traitCount = {};
        diary.forEach(entry => {
            if (entry.person === personName && entry.trait) {
                const key = `${entry.type}:${entry.trait}`;
                if (!traitCount[key]) {
                    traitCount[key] = { count: 0, trait: entry.trait, type: entry.type };
                }
                traitCount[key].count += entry.impact;
            }
        });
        return Object.values(traitCount).sort((a, b) => b.count - a.count);
    }

    // Функция сохранения с debounce
    async function saveData() {
        if (isLocalChange) return; // Не сохраняем, если изменение пришло из Firestore
        
        if (saveTimeout) {
            clearTimeout(saveTimeout);
        }
        
        saveTimeout = setTimeout(async () => {
            try {
                syncStatus.textContent = '💾 Сохранение...';
                await updateDoc(docRef, {
                    people: people,
                    diary: diary,
                    lastUpdated: serverTimestamp()
                });
                syncStatus.textContent = '✅ Сохранено в Firebase';
            } catch (error) {
                console.error("Ошибка сохранения:", error);
                syncStatus.textContent = '❌ Ошибка сохранения: ' + error.message;
            }
        }, 500); // Задержка 500мс для debounce
    }

    // Инициализация и подписка на изменения
    async function initFirebase() {
        try {
            syncStatus.textContent = '🔄 Подключение к Firebase...';
            
            // Проверяем существование документа
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) {
                // Создаем документ, если его нет
                await setDoc(docRef, {
                    people: [],
                    diary: [],
                    createdAt: serverTimestamp(),
                    lastUpdated: serverTimestamp()
                });
                syncStatus.textContent = '✅ База данных создана';
            } else {
                syncStatus.textContent = '✅ Подключено к Firebase';
            }
            
            // Подписываемся на изменения в реальном времени
            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    isLocalChange = true;
                    people = data.people || [];
                    diary = data.diary || [];
                    renderAll();
                    syncStatus.textContent = '🔄 Синхронизировано с облаком';
                    isLocalChange = false;
                }
            }, (error) => {
                console.error("Ошибка подписки:", error);
                syncStatus.textContent = '⚠️ Ошибка синхронизации: ' + error.message;
            });
            
        } catch (error) {
            console.error("Ошибка инициализации:", error);
            syncStatus.textContent = '❌ Ошибка: ' + error.message;
            // Загружаем пустые данные при ошибке
            people = [];
            diary = [];
            renderAll();
        }
    }

    function updatePersonSelect() {
        const currentValue = personSelect.value;
        personSelect.innerHTML = '';
        
        if (people.length === 0) {
            const emptyOption = document.createElement('option');
            emptyOption.value = '';
            emptyOption.textContent = '-- нет имён --';
            emptyOption.disabled = true;
            emptyOption.selected = true;
            personSelect.appendChild(emptyOption);
            return;
        }
        
        people.forEach(person => {
            const option = document.createElement('option');
            option.value = person.name;
            option.textContent = `${person.name} (${person.score})`;
            personSelect.appendChild(option);
        });
        
        if (people.some(p => p.name === currentValue)) {
            personSelect.value = currentValue;
        } else {
            personSelect.value = people[0].name;
        }
    }

    function renderStats() {
        statsContainer.innerHTML = '';
        if (people.length === 0) {
            statsContainer.innerHTML = '<div class="empty-stats-message">👥 Пока нет ни одного имени.<br>Нажмите «+ Имя» ниже, чтобы добавить.</div>';
            return;
        }
        
        people.forEach(person => {
            const personDiv = document.createElement('div');
            personDiv.className = 'person-card';
            
            // Кнопка удаления
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-person-btn';
            deleteBtn.textContent = '✖';
            deleteBtn.title = 'Удалить человека';
            deleteBtn.addEventListener('click', async () => {
                if (confirm(`Удалить "${person.name}" и все записи о нём?`)) {
                    people = people.filter(p => p.name !== person.name);
                    diary = diary.filter(entry => entry.person !== person.name);
                    await saveData();
                    renderAll();
                }
            });
            personDiv.appendChild(deleteBtn);
            
            const nameLabel = document.createElement('div');
            nameLabel.className = 'name-label';
            nameLabel.textContent = person.name;
            personDiv.appendChild(nameLabel);
            
            const flask = document.createElement('div');
            flask.className = 'flask-container';
            
            const top = document.createElement('div');
            top.className = 'flask-top';
            flask.appendChild(top);
            
            const fillArea = document.createElement('div');
            fillArea.className = 'fill-area';
            flask.appendChild(fillArea);
            
            const neutralMarker = document.createElement('div');
            neutralMarker.className = 'neutral-marker';
            fillArea.appendChild(neutralMarker);
            
            const score = clampScore(person.score);
            let greenPercent = 0;
            let redPercent = 0;
            
            if (score >= 0) {
                greenPercent = score;
                redPercent = 0;
            } else {
                redPercent = Math.abs(score);
                greenPercent = 0;
            }
            
            const greenFill = document.createElement('div');
            greenFill.className = 'green-fill';
            greenFill.style.height = `${greenPercent}%`;
            greenFill.style.width = '100%';
            greenFill.style.alignSelf = 'flex-start';
            fillArea.appendChild(greenFill);
            
            const redFill = document.createElement('div');
            redFill.className = 'red-fill';
            redFill.style.height = `${redPercent}%`;
            redFill.style.width = '100%';
            redFill.style.alignSelf = 'flex-end';
            fillArea.appendChild(redFill);
            
            personDiv.appendChild(flask);
            
            const statusBadge = document.createElement('div');
            statusBadge.className = 'status-badge';
            statusBadge.textContent = getRelationshipStatus(score);
            personDiv.appendChild(statusBadge);
            
            const scoreSmall = document.createElement('div');
            scoreSmall.className = 'score-value';
            scoreSmall.textContent = `(${score > 0 ? '+' : ''}${score})`;
            personDiv.appendChild(scoreSmall);
            
            const traits = getTraitsForPerson(person.name);
            const traitsContainer = document.createElement('div');
            traitsContainer.className = 'traits-container';
            
            if (traits.length === 0) {
                const noTraits = document.createElement('span');
                noTraits.style.fontSize = '0.7rem';
                noTraits.style.color = '#666';
                noTraits.textContent = 'нет ярлыков';
                traitsContainer.appendChild(noTraits);
            } else {
                traits.slice(0, 4).forEach(traitData => {
                    const chip = document.createElement('span');
                    chip.className = `trait-chip ${traitData.type === 'positive' ? 'positive-trait' : 'negative-trait'}`;
                    chip.textContent = `${traitData.trait} (${traitData.count})`;
                    traitsContainer.appendChild(chip);
                });
                if (traits.length > 4) {
                    const more = document.createElement('span');
                    more.className = 'trait-chip';
                    more.textContent = `+${traits.length - 4}`;
                    traitsContainer.appendChild(more);
                }
            }
            personDiv.appendChild(traitsContainer);
            
            statsContainer.appendChild(personDiv);
        });
    }

    function renderDiary() {
        diaryEntriesDiv.innerHTML = '';
        if (diary.length === 0) {
            diaryEntriesDiv.innerHTML = '<div class="empty-message">📭 В дневнике пока пусто. Добавьте первую запись.</div>';
            return;
        }
        
        const reversedDiary = [...diary].reverse();
        reversedDiary.forEach((entry, index) => {
            const entryDiv = document.createElement('div');
            entryDiv.className = `entry ${entry.type}`;
            
            const personSpan = document.createElement('span');
            personSpan.className = 'entry-person';
            personSpan.textContent = entry.person;
            
            const descSpan = document.createElement('span');
            descSpan.className = 'entry-desc';
            descSpan.textContent = entry.description || 'без описания';
            
            const impactSpan = document.createElement('span');
            impactSpan.className = 'entry-impact';
            const sign = entry.type === 'positive' ? '+' : '-';
            impactSpan.textContent = `${sign}${entry.impact}`;
            
            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-btn';
            removeBtn.textContent = '✖';
            removeBtn.title = 'Удалить запись';
            
            const originalIndex = diary.length - 1 - index;
            removeBtn.addEventListener('click', async () => {
                // Отменяем влияние записи на счёт
                const entryToRemove = diary[originalIndex];
                const personIndex = people.findIndex(p => p.name === entryToRemove.person);
                if (personIndex !== -1) {
                    const delta = entryToRemove.type === 'positive' ? entryToRemove.impact : -entryToRemove.impact;
                    people[personIndex].score = clampScore(people[personIndex].score - delta);
                }
                
                diary.splice(originalIndex, 1);
                await saveData();
                renderAll();
            });
            
            entryDiv.appendChild(personSpan);
            entryDiv.appendChild(descSpan);
            
            if (entry.trait) {
                const traitSpan = document.createElement('span');
                traitSpan.className = 'entry-trait';
                traitSpan.textContent = entry.trait;
                entryDiv.appendChild(traitSpan);
            }
            
            entryDiv.appendChild(impactSpan);
            entryDiv.appendChild(removeBtn);
            diaryEntriesDiv.appendChild(entryDiv);
        });
    }

    function renderAll() {
        updatePersonSelect();
        renderStats();
        renderDiary();
    }

    // Обработчики событий
    addEntryBtn.addEventListener('click', async () => {
        const selectedPerson = personSelect.value;
        if (!selectedPerson) {
            alert('Сначала добавьте хотя бы одно имя.');
            return;
        }
        
        const description = entryDescription.value.trim();
        if (!description) {
            alert('Введите описание события.');
            return;
        }
        
        const type = entryType.value;
        const impact = parseInt(entryImpact.value, 10);
        if (isNaN(impact) || impact < 1 || impact > 10) {
            alert('Сила должна быть от 1 до 10.');
            return;
        }
        
        const trait = entryTrait.value;
        
        const personIndex = people.findIndex(p => p.name === selectedPerson);
        if (personIndex === -1) {
            alert('Имя не найдено.');
            return;
        }
        
        const delta = type === 'positive' ? impact : -impact;
        people[personIndex].score = clampScore(people[personIndex].score + delta);
        
        diary.push({
            person: selectedPerson,
            description: description,
            type: type,
            impact: impact,
            trait: trait || null,
            timestamp: new Date().toISOString()
        });
        
        entryDescription.value = '';
        entryTrait.value = '';
        
        await saveData();
        renderAll();
    });

    addPersonBtn.addEventListener('click', async () => {
        const newName = prompt('Введите имя нового человека:');
        if (!newName) return;
        
        const trimmedName = newName.trim();
        if (!trimmedName) return;
        
        if (people.some(p => p.name.toLowerCase() === trimmedName.toLowerCase())) {
            alert('Такое имя уже существует.');
            return;
        }
        
        people.push({ 
            name: trimmedName, 
            score: 0,
            createdAt: new Date().toISOString()
        });
        
        await saveData();
        renderAll();
    });

    // Инициализация приложения
    initFirebase();
</script>
</body>
</html>
